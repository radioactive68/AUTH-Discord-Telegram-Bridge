name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        database: [sqlite, mariadb]

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['6379:6379']
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: dtb_ci
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
        ports: ['3306:3306']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "allianceauth>=5.0,<6" mysqlclient
          pip install -e .

      - name: Django system check
        run: python -m django check --settings=dtb_tests.settings

      - name: Detect missing migrations
        run: python -m django makemigrations --check --dry-run --settings=dtb_tests.settings

      - name: Run test suite (SQLite)
        if: matrix.database == 'sqlite'
        run: python -m django test dtb_tests --settings=dtb_tests.settings -v 2

      - name: Run test suite (MariaDB)
        if: matrix.database == 'mariadb'
        run: python -m django test dtb_tests --settings=dtb_tests.settings -v 2
        env:
          DTB_TEST_DB: mariadb
          DTB_TEST_DB_PASSWORD: root

  package:
    name: sdist/wheel build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify plugin files inside the wheel
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              'aa_discord_telegram_bridge/migrations/0021_default_permissions.py',
              'aa_discord_telegram_bridge/templates/dtb/admin_members.html',
              'aa_discord_telegram_bridge/locale/ru/LC_MESSAGES/django.mo',
          ]
          missing = [n for n in required if n not in names]
          if missing:
              print('missing from wheel:', missing)
              sys.exit(1)
          print('wheel OK:', wheel)
          EOF
