name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check syntax / imports
        run: |
          python -c "import aa_discord_telegram_bridge; print('version:', aa_discord_telegram_bridge.__version__)"
      - name: Django checks
        run: |
          python -m django check --settings=dtb_tests.settings || true
